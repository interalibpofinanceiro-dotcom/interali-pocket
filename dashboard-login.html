<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meu Painel — Interali Pocket</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            teal: '#0d2b28',
            tealDark: '#081a18',
            tealLight: '#123a35',
            gold: '#c9a227',
            goldLight: '#e3c877',
            goldDark: '#9c7d1e'
          }
        }
      }
    }
  };
</script>
</head>
<body class="bg-brand-teal text-slate-100 antialiased min-h-screen flex items-center justify-center px-5">

  <div class="w-full max-w-sm">
    <div class="flex items-center justify-center gap-3 mb-8">
      <img src="/logo.jpg" alt="Interali" class="h-11 w-11 rounded-full object-cover" />
      <span class="text-xl font-bold tracking-tight">Interali <span class="text-brand-gold">Pocket</span></span>
    </div>

    <div class="rounded-2xl border border-slate-700 bg-slate-800/50 p-7">
      <h1 class="text-lg font-bold text-center">Meu Painel</h1>
      <p class="text-sm text-slate-400 text-center mt-1">Entre com o WhatsApp cadastrado no Pocket.</p>

      <form id="login-form" class="mt-6 space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">WhatsApp</label>
          <input required type="tel" id="input-whatsapp" placeholder="(44) 99999-9999"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:border-brand-gold" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Senha</label>
          <input required type="password" id="input-senha" placeholder="Sua senha"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:border-brand-gold" />
        </div>

        <div id="feedback" class="hidden text-sm rounded-lg px-3.5 py-2.5 bg-red-500/10 text-red-300"></div>

        <button type="submit" id="submit-btn"
          class="w-full bg-brand-gold hover:bg-brand-goldLight text-brand-tealDark font-bold py-3 rounded-full transition">
          Entrar
        </button>
      </form>

      <p class="text-[11px] text-center text-slate-500 mt-5">Não tem senha ainda? Fale com a Interali pelo WhatsApp de suporte.</p>
    </div>
  </div>

<script>
(function () {
  "use strict";
  var form = document.getElementById("login-form");
  var feedback = document.getElementById("feedback");
  var submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    feedback.classList.add("hidden");
    submitBtn.disabled = true;
    submitBtn.textContent = "Entrando...";

    fetch("/dashboard/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        whatsapp: document.getElementById("input-whatsapp").value.trim(),
        senha: document.getElementById("input-senha").value
      })
    })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, dados: d }; }); })
      .then(function (r) {
        if (r.status >= 400 || !r.dados.ok) {
          feedback.textContent = r.dados.erro || "Não consegui entrar agora. Tenta de novo.";
          feedback.classList.remove("hidden");
          submitBtn.disabled = false;
          submitBtn.textContent = "Entrar";
          return;
        }
        window.location.href = "/dashboard";
      })
      .catch(function () {
        feedback.textContent = "Não consegui me conectar agora. Verifique sua internet e tente de novo.";
        feedback.classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtn.textContent = "Entrar";
      });
  });
})();
</script>
</body>
</html>
