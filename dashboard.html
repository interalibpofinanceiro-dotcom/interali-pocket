<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meu Painel — Interali Pocket</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            teal: '#0d2b28',
            tealDark: '#081a18',
            tealLight: '#123a35',
            gold: '#c9a227',
            goldLight: '#e3c877',
            goldDark: '#9c7d1e'
          }
        }
      }
    }
  };
</script>
<style>
  .card { background: rgba(30,41,59,.5); border: 1px solid #334155; border-radius: 1rem; padding: 1.25rem; }
  .skeleton { background: linear-gradient(90deg, rgba(51,65,85,.4) 25%, rgba(71,85,105,.5) 37%, rgba(51,65,85,.4) 63%); background-size: 400% 100%; animation: skeleton 1.4s ease infinite; border-radius: .5rem; }
  @keyframes skeleton { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
</style>
</head>
<body class="bg-brand-teal text-slate-100 antialiased min-h-screen">

<header class="border-b border-brand-gold/20">
  <div class="max-w-5xl mx-auto px-5 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="/logo.jpg" alt="Interali" class="h-9 w-9 rounded-full object-cover" />
      <span class="font-bold tracking-tight">Interali <span class="text-brand-gold">Pocket</span></span>
    </div>
    <div class="flex items-center gap-4">
      <span id="nome-cliente" class="text-sm text-slate-300"></span>
      <a href="/dashboard/logout" class="text-xs text-slate-400 hover:text-white border border-slate-700 rounded-full px-3 py-1.5 transition">Sair</a>
    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-5 py-8">

  <div id="carregando" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">
    <div class="skeleton h-24"></div>
    <div class="skeleton h-24"></div>
    <div class="skeleton h-24"></div>
    <div class="skeleton h-24"></div>
  </div>

  <div id="erro" class="hidden card border-red-500/30 bg-red-500/5 text-red-200 text-sm"></div>

  <div id="conteudo" class="hidden space-y-8"></div>

</main>

<script>
(function () {
  "use strict";

  function formatarMoeda(v) {
    return (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }
  function formatarDataCurta(iso) {
    if (!iso) return '';
    var partes = iso.split('-');
    return partes.length === 3 ? (partes[2] + '/' + partes[1]) : iso;
  }

  var CORES = { gold: '#c9a227', goldLight: '#e3c877', green: '#4ade80', red: '#f87171', grid: 'rgba(148,163,184,.15)', texto: '#cbd5e1' };

  function card(rotulo, valor, corValor, subtexto) {
    return (
      '<div class="card">' +
        '<p class="text-xs text-slate-400">' + rotulo + '</p>' +
        '<p class="text-2xl font-bold mt-1" style="color:' + (corValor || '#f1f5f9') + '">' + valor + '</p>' +
        (subtexto ? '<p class="text-xs text-slate-500 mt-1">' + subtexto + '</p>' : '') +
      '</div>'
    );
  }

  function secao(titulo, conteudoHtml) {
    return (
      '<section>' +
        '<h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wide mb-3">' + titulo + '</h2>' +
        conteudoHtml +
      '</section>'
    );
  }

  function montarGrafico(canvasId, labels, datasets) {
    var ctx = document.getElementById(canvasId).getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: { labels: labels, datasets: datasets },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { labels: { color: CORES.texto } } },
        scales: {
          x: { ticks: { color: CORES.texto, maxTicksLimit: 8 }, grid: { color: CORES.grid } },
          y: { ticks: { color: CORES.texto }, grid: { color: CORES.grid } }
        }
      }
    });
  }

  function renderizarPadrao(d) {
    var comp = d.comparacaoMesAnterior;
    var compTexto = '';
    if (comp && comp.percentual !== null && comp.percentual !== undefined) {
      var sinal = comp.diferenca >= 0 ? '▲' : '▼';
      compTexto = sinal + ' ' + Math.abs(comp.percentual).toFixed(0) + '% vs. mês anterior';
    }

    var cards =
      card('Saldo Atual', formatarMoeda(d.saldoAtual), null) +
      card('Entradas (mês)', formatarMoeda(d.resumoMes.entradas), CORES.green) +
      card('Saídas (mês)', formatarMoeda(d.resumoMes.saidas), CORES.red) +
      card('Resultado (mês)', formatarMoeda(d.resumoMes.resultado), d.resumoMes.resultado >= 0 ? CORES.green : CORES.red, compTexto);

    var categorias = (d.topCategorias || []).map(function (c) {
      return '<div class="flex justify-between text-sm py-2 border-b border-slate-700/50"><span>' + c.categoria + '</span><span class="text-slate-300">' + formatarMoeda(c.total) + '</span></div>';
    }).join('') || '<p class="text-sm text-slate-500">Sem despesas categorizadas este mês ainda.</p>';

    var contas = (d.contasEmAberto || []).map(function (c) {
      return '<tr class="border-b border-slate-700/50"><td class="py-2 pr-3">' + formatarDataCurta(c.vencimento) + '</td><td class="py-2 pr-3">' + (c.beneficiario || '-') + '</td><td class="py-2 text-right">' + formatarMoeda(c.valor) + '</td></tr>';
    }).join('') || '<tr><td colspan="3" class="py-3 text-sm text-slate-500">Nenhuma conta em aberto. 🎉</td></tr>';

    // Linha de leitura + aviso de consistência (09/09/2026, inspirado no padrão visual do curso
    // "Seu financeiro no Claude" — "faça a conta primeiro e confira"). O aviso só aparece se a
    // checagem estrutural falhar (nunca deveria, é rede de segurança); a linha de leitura sempre
    // aparece quando há dado suficiente.
    var avisoConsistencia = (d.consistencia && d.consistencia.consistente === false)
      ? '<div class="card border-amber-500/30 bg-amber-500/5 text-amber-200 text-sm mb-4">⚠️ Os números deste mês não bateram na checagem interna (diferença de ' + formatarMoeda(d.consistencia.diferenca) + '). Os valores acima ainda são exibidos, mas vale conferir com o suporte antes de usar pra decisão.</div>'
      : '';
    var linhaLeitura = d.linhaDeLeitura
      ? '<p class="text-sm text-slate-400 italic mb-4">' + d.linhaDeLeitura + '</p>'
      : '';

    document.getElementById('conteudo').innerHTML =
      avisoConsistencia + linhaLeitura +
      '<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">' + cards + '</div>' +
      secao('Fluxo de caixa — últimos 30 dias', '<div class="card"><canvas id="grafico-fluxo" height="90"></canvas></div>') +
      '<div class="grid md:grid-cols-2 gap-6">' +
        secao('Top categorias de despesa (mês)', '<div class="card">' + categorias + '</div>') +
        secao('Contas a pagar em aberto', '<div class="card overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-slate-400 text-xs"><th class="text-left pb-2">Vencimento</th><th class="text-left pb-2">Beneficiário</th><th class="text-right pb-2">Valor</th></tr></thead><tbody>' + contas + '</tbody></table></div>') +
      '</div>';

    var labels = d.serieDiaria.map(function (p) { return formatarDataCurta(p.data); });
    montarGrafico('grafico-fluxo', labels, [
      { label: 'Entradas', data: d.serieDiaria.map(function (p) { return p.entradas; }), borderColor: CORES.green, backgroundColor: 'transparent', tension: .3 },
      { label: 'Saídas', data: d.serieDiaria.map(function (p) { return p.saidas; }), borderColor: CORES.red, backgroundColor: 'transparent', tension: .3 }
    ]);
  }

  function montarGraficoBarras(canvasId, labels, valores) {
    var ctx = document.getElementById(canvasId).getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: { labels: labels, datasets: [{ label: 'Unidades vendidas', data: valores, backgroundColor: CORES.gold, borderRadius: 4 }] },
      options: {
        responsive: true,
        indexAxis: 'y',
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: CORES.texto }, grid: { color: CORES.grid } },
          y: { ticks: { color: CORES.texto }, grid: { display: false } }
        }
      }
    });
  }

  function renderizarCardsPeriodo(relatorio, periodo) {
    var r = relatorio[periodo];
    var nomes = { dia: 'hoje', semana: 'últimos 7 dias', mes: 'este mês' };
    var diferencaTaxas = r.total - r.liquido;
    document.getElementById('cards-periodo').innerHTML =
      card('Total Vendido (' + nomes[periodo] + ')', formatarMoeda(r.total), CORES.gold) +
      card('Total Líquido (após taxa cartão)', formatarMoeda(r.liquido), CORES.green, diferencaTaxas > 0 ? '-' + formatarMoeda(diferencaTaxas) + ' em taxas' : 'sem taxa descontada') +
      card('Nº de Vendas', String(r.numeroVendas), null) +
      card('Ticket Médio', formatarMoeda(r.ticketMedio), null);
  }

  function renderizarComercio(d) {
    var estoqueTexto = d.estoqueTotalAtual !== null && d.estoqueTotalAtual !== undefined ? String(d.estoqueTotalAtual) + ' un.' : '—';
    var lucroTexto = d.lucroEstimadoTotal !== null ? formatarMoeda(d.lucroEstimadoTotal) : '—';
    var cardsFixos =
      card('Estoque Total Atual', estoqueTexto, null, 'soma do que foi preenchido manualmente') +
      card('Clientes Cadastrados', String((d.clientesFinais || []).length), null) +
      card('Lucro Estimado (mês)', lucroTexto, d.lucroEstimadoTotal !== null ? CORES.green : null, d.lucroEstimadoTotal !== null ? 'baseado no custo unitário preenchido' : 'preencha "Custo_Unitario" na Matriz pra calcular');

    var ranking = (d.rankingMaisVendidos || []).slice(0, 8);
    var labelsRanking = ranking.map(function (p) { return p.produto.length > 28 ? p.produto.slice(0, 28) + '…' : p.produto; });
    var valoresRanking = ranking.map(function (p) { return p.qtdVendida; });

    var fornecedores = d.fornecedores || [];
    var opcoesFornecedor = '<option value="">Todos os fornecedores</option>' + fornecedores.map(function (f) { return '<option value="' + f + '">' + f + '</option>'; }).join('');

    function linhaProduto(p) {
      var saldoTexto = p.saldo !== null
        ? '<span class="' + (p.precisaRepor ? 'text-red-400 font-semibold' : 'text-slate-400') + '">saldo: ' + p.saldo + (p.precisaRepor ? ' ⚠️ repor' : '') + '</span>'
        : '<span class="text-slate-600">estoque não preenchido</span>';
      return (
        '<tr class="border-b border-slate-700/50" data-fornecedor="' + (p.fornecedor || '') + '">' +
          '<td class="py-2 pr-3">' + p.produto + '</td>' +
          '<td class="py-2 pr-3 text-slate-400 text-xs">' + (p.fornecedor || '—') + '</td>' +
          '<td class="py-2 pr-3 text-right text-brand-gold font-semibold">' + p.qtdVendida + '</td>' +
          '<td class="py-2 pr-3 text-right">' + (p.estoque !== null ? p.estoque : '—') + '</td>' +
          '<td class="py-2 text-right text-xs">' + saldoTexto + '</td>' +
        '</tr>'
      );
    }
    var linhasEstoque = (d.produtos || []).map(linhaProduto).join('') || '<tr><td colspan="5" class="py-3 text-sm text-slate-500">Nenhum produto lançado ainda.</td></tr>';

    var termometro = (d.precisamRepor || []).map(function (p) {
      return '<div class="flex justify-between text-sm py-2 border-b border-slate-700/50"><span>' + p.produto + (p.fornecedor ? ' <span class="text-slate-500 text-xs">(' + p.fornecedor + ')</span>' : '') + '</span><span class="text-red-400 font-semibold">saldo: ' + p.saldo + '</span></div>';
    }).join('') || '<p class="text-sm text-slate-500">Nenhum produto abaixo do estoque mínimo agora. 🎉</p>';

    var conferencia = (d.divergenciasConferencia || []).map(function (p) {
      var cor = p.divergenciaConferencia < 0 ? 'text-red-400' : 'text-yellow-400';
      var sinal = p.divergenciaConferencia > 0 ? '+' : '';
      return '<div class="flex justify-between text-sm py-2 border-b border-slate-700/50"><span>' + p.produto + '</span><span>IA: ' + p.qtdVendida + ' · físico: ' + p.conferenciaFisica + ' · <span class="' + cor + ' font-semibold">' + sinal + p.divergenciaConferencia + '</span></span></div>';
    }).join('') || '<p class="text-sm text-slate-500">Nenhuma contagem física registrada ainda (preencha a coluna "Conferencia" na planilha pra comparar com o que a IA lançou).</p>';

    var vendas = (d.vendasRecentes || []).map(function (v) {
      return '<tr class="border-b border-slate-700/50"><td class="py-2 pr-3">' + formatarDataCurta(v.data) + '</td><td class="py-2 pr-3">' + (v.numeroVenda ? '#' + v.numeroVenda : '-') + '</td><td class="py-2 pr-3">' + v.cliente + '</td><td class="py-2 text-right">' + formatarMoeda(v.valorTotal) + '</td></tr>';
    }).join('') || '<tr><td colspan="4" class="py-3 text-sm text-slate-500">Nenhuma venda registrada ainda.</td></tr>';

    var clientes = (d.clientesFinais || []).map(function (c) {
      return '<div class="flex justify-between text-sm py-2 border-b border-slate-700/50"><span>' + c.nome + '</span><span class="text-slate-300">' + c.qtdCompras + 'x — ' + formatarMoeda(c.valorTotalComprado) + '</span></div>';
    }).join('') || '<p class="text-sm text-slate-500">Nenhum cliente identificado ainda (a maioria das vendas foi "Consumidor Final").</p>';

    var produtosComMargem = (d.produtos || []).filter(function (p) { return p.custoUnitario !== null; });
    var linhasMargem = produtosComMargem.map(function (p) {
      var margemTexto = p.margemUnitaria !== null
        ? '<span class="' + (p.margemUnitaria >= 0 ? 'text-green-400' : 'text-red-400') + ' font-semibold">' + formatarMoeda(p.margemUnitaria) + '</span>'
        : '<span class="text-slate-600 text-xs">sem venda registrada ainda</span>';
      var markupTexto = p.markupPercentual !== null ? p.markupPercentual.toFixed(0) + '%' : '—';
      return (
        '<tr class="border-b border-slate-700/50">' +
          '<td class="py-2 pr-3">' + p.produto + '</td>' +
          '<td class="py-2 pr-3 text-right">' + formatarMoeda(p.custoUnitario) + '</td>' +
          '<td class="py-2 pr-3 text-right">' + (p.precoMedioVenda !== null ? formatarMoeda(p.precoMedioVenda) : '—') + '</td>' +
          '<td class="py-2 pr-3 text-right">' + margemTexto + '</td>' +
          '<td class="py-2 text-right">' + markupTexto + '</td>' +
        '</tr>'
      );
    }).join('') || '<tr><td colspan="5" class="py-3 text-sm text-slate-500">Nenhum produto com custo preenchido ainda — adicione o "Custo_Unitario" na aba Matriz da planilha pra ver a margem aqui.</td></tr>';

    document.getElementById('conteudo').innerHTML =
      // Abas Dia / Semana / Mês
      '<div>' +
        '<div class="flex gap-2 mb-4" id="tabs-periodo">' +
          '<button data-periodo="dia" class="btn-periodo px-4 py-1.5 rounded-full text-xs font-semibold border border-slate-700 text-slate-300">Hoje</button>' +
          '<button data-periodo="semana" class="btn-periodo px-4 py-1.5 rounded-full text-xs font-semibold border border-slate-700 text-slate-300">Semana</button>' +
          '<button data-periodo="mes" class="btn-periodo px-4 py-1.5 rounded-full text-xs font-semibold border border-brand-gold bg-brand-gold text-brand-tealDark">Mês</button>' +
        '</div>' +
        '<div id="cards-periodo" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5"></div>' +
      '</div>' +
      '<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">' + cardsFixos + '</div>' +
      secao('Vendas — tendência (30 dias)', '<div class="card"><canvas id="grafico-vendas" height="90"></canvas></div>') +
      secao('Ranking de produtos mais vendidos', '<div class="card"><canvas id="grafico-ranking" height="' + Math.max(120, ranking.length * 36) + '"></canvas></div>') +
      '<div class="grid md:grid-cols-2 gap-6">' +
        secao('🌡️ Termômetro de Reposição', '<div class="card">' + termometro + '</div>') +
        secao('✅ Conferência Diária (IA × físico)', '<div class="card">' + conferencia + '</div>') +
      '</div>' +
      secao('Painel de Estoque & Produtos por Fornecedor',
        '<div class="card">' +
          '<div class="mb-3"><select id="filtro-fornecedor" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs">' + opcoesFornecedor + '</select></div>' +
          '<div class="overflow-x-auto"><table class="w-full text-sm" id="tabela-estoque"><thead><tr class="text-slate-400 text-xs"><th class="text-left pb-2">Produto</th><th class="text-left pb-2">Fornecedor</th><th class="text-right pb-2">Vendido</th><th class="text-right pb-2">Estoque</th><th class="text-right pb-2">Saldo</th></tr></thead><tbody>' + linhasEstoque + '</tbody></table></div>' +
        '</div>') +
      secao('💰 Margem & Precificação',
        '<div class="card">' +
          '<p class="text-xs text-slate-500 mb-3">Custo unitário é preenchido à mão na planilha (aba Matriz, coluna "Custo_Unitario"). Preço de venda é a média do que foi realmente cobrado nas vendas.</p>' +
          '<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-slate-400 text-xs"><th class="text-left pb-2">Produto</th><th class="text-right pb-2">Custo</th><th class="text-right pb-2">Preço médio</th><th class="text-right pb-2">Margem</th><th class="text-right pb-2">Markup</th></tr></thead><tbody>' + linhasMargem + '</tbody></table></div>' +
        '</div>') +
      '<div class="grid md:grid-cols-2 gap-6">' +
        secao('Clientes mais frequentes', '<div class="card">' + clientes + '</div>') +
        secao('Vendas recentes', '<div class="card overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-slate-400 text-xs"><th class="text-left pb-2">Data</th><th class="text-left pb-2">Nº</th><th class="text-left pb-2">Cliente</th><th class="text-right pb-2">Total</th></tr></thead><tbody>' + vendas + '</tbody></table></div>') +
      '</div>';

    renderizarCardsPeriodo(d.relatorioPorPeriodo, 'mes');
    document.querySelectorAll('.btn-periodo').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.btn-periodo').forEach(function (b) {
          b.classList.remove('border-brand-gold', 'bg-brand-gold', 'text-brand-tealDark');
          b.classList.add('border-slate-700', 'text-slate-300');
        });
        btn.classList.remove('border-slate-700', 'text-slate-300');
        btn.classList.add('border-brand-gold', 'bg-brand-gold', 'text-brand-tealDark');
        renderizarCardsPeriodo(d.relatorioPorPeriodo, btn.getAttribute('data-periodo'));
      });
    });

    document.getElementById('filtro-fornecedor').addEventListener('change', function (e) {
      var alvo = e.target.value;
      document.querySelectorAll('#tabela-estoque tbody tr').forEach(function (tr) {
        tr.hidden = Boolean(alvo) && tr.getAttribute('data-fornecedor') !== alvo;
      });
    });

    var labels = d.serieDiaria.map(function (p) { return formatarDataCurta(p.data); });
    montarGrafico('grafico-vendas', labels, [
      { label: 'Vendido por dia', data: d.serieDiaria.map(function (p) { return p.total; }), borderColor: CORES.gold, backgroundColor: 'rgba(201,162,39,.15)', fill: true, tension: .3 }
    ]);
    if (ranking.length > 0) montarGraficoBarras('grafico-ranking', labelsRanking, valoresRanking);
  }

  fetch('/api/dashboard/dados')
    .then(function (r) { return r.json().then(function (d) { return { status: r.status, dados: d }; }); })
    .then(function (r) {
      if (r.status === 401) { window.location.href = '/dashboard/login'; return; }
      document.getElementById('carregando').classList.add('hidden');

      if (r.status >= 400 || !r.dados.ok) {
        var erroEl = document.getElementById('erro');
        erroEl.textContent = (r.dados && r.dados.erro) || 'Não consegui carregar seus dados agora.';
        erroEl.classList.remove('hidden');
        return;
      }

      var d = r.dados.dados;
      document.getElementById('nome-cliente').textContent = d.nome || '';
      document.getElementById('conteudo').classList.remove('hidden');

      if (d.tipo === 'COMERCIO_MATRIZ') renderizarComercio(d);
      else renderizarPadrao(d);
    })
    .catch(function () {
      document.getElementById('carregando').classList.add('hidden');
      var erroEl = document.getElementById('erro');
      erroEl.textContent = 'Não consegui me conectar agora. Verifique sua internet e recarregue a página.';
      erroEl.classList.remove('hidden');
    });
})();
</script>
</body>
</html>
