name: Tarefas Proativas - Interali Pocket

# Chama os endpoints /tarefas/* do server.js (Railway) em horários fixos — necessário porque a
# hospedagem não sustenta um cron interno confiável. Ver CLAUDE.MD/CONTEXTO.md e
# HISTORICO-COMPLETO.md no repositório de documentação pro contexto completo.
#
# 2 tarefas, 2 jobs (cada um só roda no seu próprio agendamento, ou nos dois via disparo manual):
# - disparar-relatorio: resumo semanal (toda sexta) / mensal (dia 1) — manda só o "avisador"
#   via template; o relatório de verdade (o que já foi pago/recebido na semana — dado REALIZADO,
#   não previsão) sai quando o cliente responde.
# - disparar-despesas-fixas: todo dia, lança sozinho toda despesa/receita fixa recorrente
#   (comando "recorrente:") cujo dia bate com hoje.
#
# 17/08/2026 (pedido do Aroldo): resumo semanal movido de segunda pra SEXTA — faz mais sentido
# fechar a semana com o que já aconteceu de verdade (entradas/saídas realizadas) do que abrir a
# semana com uma previsão. A previsão de contas a pagar (`/tarefas/previsao`) continua fora deste
# cron de propósito — fica só sob demanda (cliente pergunta "previsão"), pra não virar mais um
# envio de template cobrado pela Meta toda semana sem o cliente ter pedido.
on:
  schedule:
    # Toda sexta-feira às 08:00 (horário de Brasília, UTC-3) — resumo da semana
    - cron: '0 11 * * 5'
    # Todo dia 1 do mês às 08:00 (horário de Brasília) — resumo do mês
    - cron: '0 11 1 * *'
    # Todo dia às 08:00 (horário de Brasília) — despesas/receitas fixas recorrentes
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      periodo:
        description: 'Período do relatório (também dispara despesas fixas junto)'
        required: false
        default: 'semana'
        type: choice
        options: [dia, semana, mes]

jobs:
  disparar-relatorio:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * 5' || github.event.schedule == '0 11 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: Define o período (agendado vs. disparo manual)
        id: periodo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "valor=${{ inputs.periodo }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 11 1 * *" ]; then
            echo "valor=mes" >> "$GITHUB_OUTPUT"
          else
            echo "valor=semana" >> "$GITHUB_OUTPUT"
          fi

      - name: Chama /tarefas/relatorio/${{ steps.periodo.outputs.valor }}
        run: |
          curl -sf -X POST "https://pocket.interali.com.br/tarefas/relatorio/${{ steps.periodo.outputs.valor }}?chave=${{ secrets.RELATORIO_SECRET }}" \
            -o resposta.json -w "\nHTTP %{http_code}\n"
          cat resposta.json

  disparar-despesas-fixas:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Chama /tarefas/despesas-fixas
        run: |
          curl -sf -X POST "https://pocket.interali.com.br/tarefas/despesas-fixas?chave=${{ secrets.RELATORIO_SECRET }}" \
            -o resposta.json -w "\nHTTP %{http_code}\n"
          cat resposta.json
