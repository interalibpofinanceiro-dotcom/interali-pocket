<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nova senha — Interali Pocket</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { teal: '#0d2b28', tealDark: '#081a18', tealLight: '#123a35', gold: '#c9a227', goldLight: '#e3c877', goldDark: '#9c7d1e' }
        }
      }
    }
  };
</script>
</head>
<body class="bg-brand-teal text-slate-100 antialiased min-h-screen flex items-center justify-center px-5">

  <div class="w-full max-w-sm">
    <div class="flex items-center justify-center gap-3 mb-8">
      <img src="/logo.jpg" alt="Interali" class="h-11 w-11 rounded-full object-cover" />
      <span class="text-xl font-bold tracking-tight">Interali <span class="text-brand-gold">Pocket</span></span>
    </div>

    <div class="rounded-2xl border border-slate-700 bg-slate-800/50 p-7">
      <h1 class="text-lg font-bold text-center">Criar nova senha</h1>
      <p class="text-sm text-slate-400 text-center mt-1">Escolha uma senha nova pro seu Painel.</p>

      <form id="redefinir-form" class="mt-6 space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Nova senha</label>
          <div class="relative">
            <input required type="password" id="input-senha" placeholder="Mínimo 6 caracteres" minlength="6"
              class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-3.5 pr-10 py-2.5 text-sm focus:outline-none focus:border-brand-gold" />
            <button type="button" id="toggle-senha" aria-label="Mostrar senha"
              class="absolute right-0 top-0 h-full px-3 text-slate-500 hover:text-slate-300 transition">
              <svg id="icone-olho-aberto" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <svg id="icone-olho-fechado" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.5a10.522 10.522 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </div>
        </div>

        <div id="feedback" class="hidden text-sm rounded-lg px-3.5 py-2.5 bg-red-500/10 text-red-300"></div>

        <button type="submit" id="submit-btn"
          class="w-full bg-brand-gold hover:bg-brand-goldLight text-brand-tealDark font-bold py-3 rounded-full transition">
          Salvar nova senha
        </button>
      </form>
    </div>
  </div>

<script>
(function () {
  "use strict";
  var form = document.getElementById("redefinir-form");
  var feedback = document.getElementById("feedback");
  var submitBtn = document.getElementById("submit-btn");
  var inputSenha = document.getElementById("input-senha");

  var toggleSenha = document.getElementById("toggle-senha");
  var olhoAberto = document.getElementById("icone-olho-aberto");
  var olhoFechado = document.getElementById("icone-olho-fechado");
  toggleSenha.addEventListener("click", function () {
    var mostrando = inputSenha.type === "text";
    inputSenha.type = mostrando ? "password" : "text";
    olhoAberto.classList.toggle("hidden", !mostrando);
    olhoFechado.classList.toggle("hidden", mostrando);
  });

  var params = new URLSearchParams(window.location.search);
  var token = params.get("token");

  if (!token) {
    feedback.textContent = "Link inválido — falta o código de redefinição. Peça um novo link na tela de login.";
    feedback.classList.remove("hidden");
    form.querySelector("button[type=submit]").disabled = true;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    feedback.classList.add("hidden");
    submitBtn.disabled = true;
    submitBtn.textContent = "Salvando...";

    fetch("/dashboard/redefinir-senha", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token, novaSenha: inputSenha.value })
    })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, dados: d }; }); })
      .then(function (r) {
        if (r.status >= 400 || !r.dados.ok) {
          feedback.textContent = r.dados.erro || "Não consegui salvar a senha agora.";
          feedback.classList.remove("hidden");
          submitBtn.disabled = false;
          submitBtn.textContent = "Salvar nova senha";
          return;
        }
        submitBtn.textContent = "Senha salva ✓";
        feedback.className = "text-sm rounded-lg px-3.5 py-2.5 bg-green-500/10 text-green-300";
        feedback.textContent = "Senha alterada! Redirecionando pro login...";
        feedback.classList.remove("hidden");
        setTimeout(function () { window.location.href = "/dashboard/login"; }, 1800);
      })
      .catch(function () {
        feedback.textContent = "Não consegui me conectar agora. Verifique sua internet e tente de novo.";
        feedback.classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtn.textContent = "Salvar nova senha";
      });
  });
})();
</script>
</body>
</html>
